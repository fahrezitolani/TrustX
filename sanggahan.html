
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Klarifikasi Penjual - TrustX</title>
    <link rel="stylesheet" href="./seller.css">
    <link rel="stylesheet" href="./report.css">
    <script src="./reports.js" defer></script>
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "z5u4zp3oz8");
    </script>
</head>
<body class="seller">
    <div class="wrap">
    <header class="top">
        <a class="brand" href="./dashboard-laporanseller.html">
            <img
                src="./assets/images/logo-trustx.svg"
                alt="Logo TrustX"
                width="48"
                height="48"
            >
            <span>
                <strong>TrustX</strong>
                <small>Cek Dulu</small>
            </span>
        </a>
        <nav>
            <a href="./dashboard-laporanseller.html">Kembali</a>
        </nav>
    </header>

    <main>
        <h1>Form Klarifikasi Penjual</h1>
        <p>Ajukan hak jawab dan sertakan bukti sanggahan resmi.</p>

        <form
            id="appealForm"
            method="post"
            enctype="multipart/form-data"
        >

            <fieldset>
                <legend>Informasi Sanggahan</legend>

                <label for="reportId">ID Laporan</label>
                <input
                    id="reportId"
                    name="report_id"
                    type="text"
                    maxlength="40"
                    required
                >

                <label for="storeName">Nama Toko</label>
                <input
                    id="storeName"
                    name="store_name"
                    type="text"
                    maxlength="150"
                    required
                >

                <label for="appealReason">Alasan Sanggahan</label>
                <select id="appealReason" name="reason" required>
                    <option value="">Pilih alasan</option>
                    <option value="informasi-tidak-sesuai">
                        Informasi laporan tidak sesuai
                    </option>
                    <option value="bukti-tambahan">
                        Memiliki bukti tambahan
                    </option>
                    <option value="masalah-sudah-selesai">
                        Masalah telah diselesaikan
                    </option>
                    <option value="kesalahan-identitas">
                        Kesalahan identitas akun
                    </option>
                    <option value="lainnya">Alasan lainnya</option>
                </select>

                <label for="appealStory">Kronologi Sanggahan</label>
                <textarea
                    id="appealStory"
                    name="story"
                    rows="6"
                    maxlength="3000"
                    required
                ></textarea>
                <p>Maksimal 500 kata.</p>

                <label for="appealFiles">Bukti Pendukung</label>
                <input
                    id="appealFiles"
                    name="evidence"
                    type="file"
                    accept=".png,.jpg,.jpeg,image/png,image/jpeg"
                    multiple
                    required
                >
                <p>Unggah 1–3 file PNG/JPG/JPEG, maksimal 5 MB per file.</p>

                <label>
                    <input
                        id="appealConsent"
                        name="consent"
                        type="checkbox"
                        value="yes"
                        required
                    >
                    Saya menyatakan informasi yang diberikan benar.
                </label>

                <button id="submitAppeal" type="submit">
                    Kirim Sanggahan
                </button>

                <p id="pesanKlarifikasiPopup"
                   role="status"
                   aria-live="polite"></p>
            </fieldset>
        </form>
    </main>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
</body>
</html>
