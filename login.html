<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Masuk ke akun TrustX untuk memeriksa reputasi akun dan mengelola laporan.">
    <title>Masuk - TrustX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="seller.css">
    <script src="akun.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body class="seller" data-page="login">
    <header class="top auth-top">
        <a class="ib" href="Landing-pages.html" aria-label="Kembali">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1>MASUK</h1>
        <a class="ib auth-top-link" href="bantuan.html">[Bantuan]</a>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <div class="auth-symbol">
                <img src="./assets/images/logo-trustx.svg" alt="Logo TrustX">
            </div>
            <h1>Masuk ke Akun</h1>
            <p class="section-intro">Verifikasi akun, cek reputasi, nomor rekening, dan transaksi sebelum transfer.</p>

            <form id="loginForm" class="form-stack" novalidate>
                <div class="field">
                    <label for="loginEmail">Alamat Email</label>
                    <div class="auth-field">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M22 4l-10 8L2 4"/></svg>
                        <input type="email" id="loginEmail" name="email" autocomplete="email" required placeholder="email@example.com">
                    </div>
                </div>

                <div class="field">
                    <label for="loginPassword">Kata Sandi</label>
                    <div class="auth-field">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required placeholder="Kata sandi">
                        <button type="button" class="password-toggle" data-toggle-password="loginPassword" aria-label="Tampilkan kata sandi">Lihat</button>
                    </div>
                </div>

                <p class="auth-hint"><a href="#">Lupa kata sandi?</a></p>
                <p class="err" id="loginMessage" role="alert"></p>

                <button type="submit" class="check-btn">Masuk</button>
            </form>

            <div class="socials-sep">ATAU</div>
            <div class="socials">
                <button type="button" class="btn out" onclick="location.href='https://fahrezitolani.pythonanywhere.com/api/akun/oauth/x/start/'">MASUK via X</button>
                <button type="button" class="btn out" onclick="location.href='https://fahrezitolani.pythonanywhere.com/api/akun/oauth/google/start/'">MASUK via Google</button>
            </div>

            <p class="auth-switch">
                Belum punya akun? <a href="daftar.html">Daftar</a>
            </p>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (document.body.dataset.page !== "login") return;
            const Akun = window.TrustXAkun;
            if (!Akun) return;
            try {
                if (JSON.parse(localStorage.getItem("trustx_token"))) {
                    const v = await Akun.validasiSesi();
                    if (v.ok) {
                        const n = new URLSearchParams(location.search).get("next");
                        location.replace(n ? decodeURIComponent(n) : Akun.beranda(v.user));
                        return;
                    }
                }
            } catch { /* token tidak valid, lanjut */ }
            // handler submit tetap terpasang apa pun hasilnya di bawah
            const form = document.getElementById("loginForm");
            const msg = document.getElementById("loginMessage");
            const btn = form ? form.querySelector('button[type="submit"]') : null;
            if (!form) return;
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = (document.getElementById("loginEmail").value || "").trim();
                const password = document.getElementById("loginPassword").value || "";
                if (!email || !password) {
                    if (msg) msg.textContent = "Email dan kata sandi wajib diisi.";
                    return;
                }
                if (btn) btn.disabled = true;
                if (msg) msg.textContent = "";
                const r = await Akun.masuk(email, password);
                if (btn) btn.disabled = false;
                if (r.ok) {
                    const n = new URLSearchParams(location.search).get("next");
                    const nextTarget = n ? decodeURIComponent(n) : sessionStorage.getItem("trustx_next");
                    try { sessionStorage.removeItem("trustx_next"); } catch {}
                    location.replace(nextTarget || Akun.beranda(r.data.user));
                    return;
                }
                const text = Akun.pesan(r.data);
                if (msg) {
                    msg.textContent = text;
                    if (/belum diverifikasi/i.test(text)) {
                        Akun.emailMenunggu.set(email);
                        msg.appendChild(document.createTextNode(" "));
                        const a = document.createElement("a");
                        a.href = "verifikasi-otp.html";
                        a.textContent = "Verifikasi OTP";
                        msg.appendChild(a);
                    }
                }
            });
        });
    </script>
</body>
</html>
